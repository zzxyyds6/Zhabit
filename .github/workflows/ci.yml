name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: 生成 drift 代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 分析
        run: flutter analyze --fatal-infos

      - name: 测试
        run: flutter test

      - name: 构建 Android debug APK
        run: flutter build apk --debug

      - name: 上传 Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zhabit-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: 构建 Web(测试版检查)
        run: flutter build web

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get

      - name: 生成 drift 代码
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 构建 Android debug APK
        run: flutter build apk --debug

      - name: 启用 KVM 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行 Android Emulator 冒烟
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r -t build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant dev.zzxyyds.zhabit android.permission.POST_NOTIFICATIONS
            flutter test integration_test/android_smoke_test.dart -d emulator-5554 --no-pub